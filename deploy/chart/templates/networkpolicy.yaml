{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rdns-webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdns-webhook.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rdns-webhook.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The Kubernetes API server (aggregation) and the kubelet probes.
    - from:
        {{- range .Values.networkPolicy.ingressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    # Cluster DNS, to resolve the API host.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The RedundantDNS API.
    - to:
        {{- range .Values.networkPolicy.api.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.api.port }}
    # The Kubernetes API server.
    - to:
        {{- range .Values.networkPolicy.kubeAPIServer.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.kubeAPIServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
