version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
  exclusions:
    rules:
      # Tests may ignore errors of best-effort calls and use fixed inputs.
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
    - goimports
